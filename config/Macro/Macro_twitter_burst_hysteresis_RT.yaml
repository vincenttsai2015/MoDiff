data:
  data: twitter_burst_hysteresis_RT
  dir: './data/macro/twitter_burst_hysteresis_RT'
  file1: macro_twitter_burst_hysteresis_RT
  file2: macro_twitter_burst_hysteresis_RT_next
  batch_size: 32
  test_split: 0.1
  max_node_num: 200
  max_feat_num: 20
  spec_dim: 64          # 極少 eigenvalues
  init: ones

model:
  x: ScoreNetworkX
  adj: ScoreNetworkA_eigen
  u: ScoreNetworkU
  conv: GCN
  num_heads: 2
  depth: 1
  adim: 16
  nhid: 16
  num_layers: 6
  num_linears: 2
  c_init: 1
  c_hid: 4
  c_final: 2

train:
  name: train_wiki-vote_comp_25600bins_badBC
  num_epochs: 10          # 或 1
  lr: 0.008
  lr_schedule: True
  save_interval: 50
  print_interval: 50
  reduce_mean: False
  ema: 0.999
  weight_decay: 0.0001
  grad_norm: 1.0
  lr_decay: 0.999
  eps: 1.0e-5

sde:
  x:
    type: VP
    beta_min: 0.1
    beta_max: 50.0
    num_scales: 200
  adj:
    type: VP
    beta_min: 0.1
    beta_max: 50.0
    num_scales: 200
  u:
    type: VP
    beta_min: 0.1
    beta_max: 50.0
    num_scales: 200

sampler:
  predictor: Euler
  corrector: Langevin
  snr: 0.05
  scale_eps: 0.9
  n_steps: 1
  threshold1: 0.5
  threshold2: 0.5

sample:
  use_ema: False
  noise_removal: True
  probability_flow: False
  eps: 5.0e-2
  seed: 42